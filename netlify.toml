  to   = "/services/end-of-lease"
  status = 301

[[redirects]]
  from = "/services-end-of-lease/"
  to   = "/services/end-of-lease"
  status = 301

# ── /locations — internal link exists but page was never built ───────────────
[[redirects]]
  from = "/locations"
  to   = "/"
  status = 301

[[redirects]]
  from = "/locations/"
  to   = "/"
  status = 301

# ── Geelong URL renames — old slugs that Google may have indexed ─────────────
[[redirects]]
  from = "/cleaners-ocean-grove"
  to   = "/house-cleaning-ocean-grove"
  status = 301

[[redirects]]
  from = "/cleaners-ocean-grove/"
  to   = "/house-cleaning-ocean-grove"
  status = 301

[[redirects]]
