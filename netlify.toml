[build]
  command = "npm run build"
  publish = "dist"

# Force HTTPS
[[redirects]]
  from = "http://naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

# www → apex
[[redirects]]
  from = "https://www.naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

# ── Removed suburb pages (previously indexed, now deleted) ──────────────────
# Redirect to the nearest live hub so Google can pass the crawl equity along
# rather than hitting a 404 and discarding any accumulated authority.
[[redirects]]
  from = "/cleaners-noosa-heads"
  to   = "/"
  status = 301

[[redirects]]
  from = "/cleaners-terranora"
  to   = "/"
  status = 301

[[redirects]]
  from = "/cleaners-woolloongabba"
  to   = "/cleaners-brisbane"
  status = 301

[[redirects]]
  from = "/cleaners-carlton"
  to   = "/cleaners-melbourne"
  status = 301

[[redirects]]
  from = "/cleaners-ballina"
  to   = "/cleaners-lismore"
  status = 301

# ── Old service URL patterns ─────────────────────────────────────────────────
[[redirects]]
  from = "/service-veterans"
  to   = "/services/veterans-cleaning"
  status = 301

[[redirects]]
  from = "/service-veterans/"
  to   = "/services/veterans-cleaning"
  status = 301

[[redirects]]
