[build]
  command = "npm run build"
  publish = "dist"

# ── /sitemap.xml → the real sitemap index ──────────────────────────────────
# @astrojs/sitemap emits sitemap-index.xml, and robots.txt points at it, so
# Google finds it correctly. But most SEO auditors (Semrush, Ahrefs, Screaming
# Frog) probe the conventional /sitemap.xml first and report "missing sitemap"
# when it 404s. Serving the alias costs nothing and stops the false alarm.
# 200 rather than 301 so tools that don't follow redirects still see the XML.
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/sitemap-index.xml"
  status = 200

# ── /quote ─────────────────────────────────────────────────────────────────
# A 301 /quote → /contact-us/ used to live here, from when the URL 404'd and
# lead capture was the JS-only modal. src/pages/quote.astro now builds a real
# page at /quote/, it is the destination of every "Get a Free Quote" CTA on the
# site, and it is in the sitemap. The rule is deliberately gone: a non-forced
# redirect does not shadow an existing file, but the extension-less /quote did
# match this rule exactly, so the highest-intent URL on the site was one
# Netlify matching order away from 301ing off its own funnel page.

# Force HTTPS
[[redirects]]
  from = "http://naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

# www → apex
[[redirects]]
  from = "https://www.naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

