[build]
  command = "npm run build"
  publish = "dist"

# ── /sitemap.xml → the real sitemap index ──────────────────────────────────
# @astrojs/sitemap emits sitemap-index.xml, and robots.txt points at it, so
# Google finds it correctly. But most SEO auditors (Semrush, Ahrefs, Screaming
# Frog) probe the conventional /sitemap.xml first and report "missing sitemap"
# when it 404s. Serving the alias costs nothing and stops the false alarm.
# 200 rather than 301 so tools that don't follow redirects still see the XML.
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/sitemap-index.xml"
  status = 200

# ── /quote retired ─────────────────────────────────────────────────────────
# The quote page is gone; lead capture is the "Get a Free Quote" modal, which
# intercepts these links client-side. CTAs still point at /quote so that
# interception is untouched — this redirect only matters for the cases JS never
# runs: crawlers, no-JS visitors, and anyone with an old bookmark or inbound
# link. 301 so whatever equity the page holds passes to the contact page.
[[redirects]]
  from   = "/quote"
  to     = "/contact-us/"
  status = 301

# Force HTTPS
[[redirects]]
  from = "http://naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

[[redirects]]
