# Trailing slash normalisation — Astro static output has no trailing slash
[[redirects]]
  from = "/services/*/"
  to   = "/services/:splat"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to   = "/404"
  status = 404
