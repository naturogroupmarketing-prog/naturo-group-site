[build]
  command = "npm run build"
  publish = "dist"

# Force HTTPS
[[redirects]]
  from = "http://naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

# www → apex
[[redirects]]
  from = "https://www.naturogroup.com.au/*"
  to   = "https://naturogroup.com.au/:splat"
  status = 301
  force  = true

# Common WordPress URL patterns → new equivalents
[[redirects]]
  from = "/home"
  to   = "/"
  status = 301

[[redirects]]
  from = "/services/"
  to   = "/services"
  status = 301

[[redirects]]
  from = "/contact/"
  to   = "/contact-us"
  status = 301

[[redirects]]
  from = "/contact"
  to   = "/contact-us"
  status = 301

[[redirects]]
  from = "/about-us"
  to   = "/about"
  status = 301

[[redirects]]
  from = "/about-us/"
  to   = "/about"
  status = 301

[[redirects]]
  from = "/faq"
  to   = "/faqs"
  status = 301

[[redirects]]
  from = "/faq/"
  to   = "/faqs"
  status = 301

[[redirects]]
  from = "/blog"
  to   = "/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to   = "/"
  status = 301

[[redirects]]
  from = "/wp-content/*"
  to   = "/"
  status = 301

[[redirects]]
  from = "/wp-admin/*"
  to   = "/"
  status = 301

[[redirects]]
  from = "/wp-login.php"
  to   = "/"
  status = 301

# Trailing slash normalisation — Astro static output has no trailing slash
[[redirects]]
  from = "/services/*/"
  to   = "/services/:splat"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to   = "/404"
  status = 404
