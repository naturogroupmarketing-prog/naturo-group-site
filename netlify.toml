# ── /house-cleaning/<suburb> — display-path safety net ──────────────────────
# The Google Ads responsive search ads use a display path of
# House-Cleaning / Geelong, so the ad renders as
# naturogroup.com.au/house-cleaning/geelong. That path is cosmetic — Google
# Ads display paths never have to resolve — and the ads' Final URL is, and
# always was, the correct /house-cleaning-geelong/.
#
# These rules were added on the mistaken belief that the ads pointed at a 404.
# They did not, and no spend was wasted. Keeping them anyway for the one case
# that is real: a person who reads the ad, types the URL they can see, and
# would otherwise land on the 404 page. Cheap insurance, no downside.
[[redirects]]
  from   = "/house-cleaning/:suburb"
  to     = "/house-cleaning-:suburb/"
  status = 301

[[redirects]]
  from   = "/house-cleaning"
  to     = "/services/house-cleaning/"
  status = 301

[[redirects]]
  from   = "/house-cleaning/*"
  to     = "/services/house-cleaning/"
  status = 301

