# ── Service × suburb matrix retired, 30 Aug 2026 ────────────────────────────
# /services/{house-cleaning,deep-clean,end-of-lease}/<suburb> generated 369
# pages from one template. Measured on the built HTML they averaged 1,530
# words at 75.1% mean pairwise similarity within each service (86% at the
# worst pair) — the same doorway signature that got the ten Geelong
# end-of-lease pages consolidated above, and only 39.5% similar to the suburb
# page that actually ranks for the same town. They were already half-retired:
# excluded from the sitemap, and with zero internal links pointing at them
# anywhere on the site. That left 369 URLs that were live and indexable but
# unreachable by a crawler following links — cost with no path to benefit.
#
# The route is deleted and each URL 301s to the closest real equivalent:
# house-cleaning and deep-clean to that suburb's own page, end-of-lease to the
